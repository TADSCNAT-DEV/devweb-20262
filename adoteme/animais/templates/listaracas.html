<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raças de {{ tipo.nome }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body>
    <section class="section">
        <div class="container">
            <h1 class="title">Raças de {{ tipo.nome }}</h1>

            <table class="table is-fullwidth is-striped is-hoverable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                    </tr>
                </thead>
                <tbody>
                    {% for raca in racas %}
                    <tr>
                        <td>{{ raca.id }}</td>
                        <td>{{ raca.nome }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="has-text-centered">Nenhuma raça cadastrada para este tipo.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <a href="{% url 'animais:listatipoanimal' %}" class="button">Voltar</a>
        </div>
    </section>
</body>
</html>
