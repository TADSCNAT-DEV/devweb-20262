
 {% for message in messages %}
        {% if 'success' in message.tags %}
        <div id="success-modal" class="modal is-active">
			<button class="modal-background" type="button" aria-label="Fechar mensagem de sucesso" onclick="closeSuccessModal()"></button>
            <div class="modal-card">
                <header class="modal-card-head">
                    <p class="modal-card-title">Operação Realizada</p>
                    <button class="delete" aria-label="close" type="button" onclick="closeSuccessModal()"></button>
                </header>
                <section class="modal-card-body">
                    <article class="message is-success is-light mb-0">
                        <div class="message-body">
                            {{ message }}
                        </div>
                    </article>
                </section>
                <footer class="modal-card-foot is-justify-content-flex-end">
                    <button class="button is-success" type="button" onclick="closeSuccessModal()">OK</button>
                </footer>
            </div>
        </div>
        {% endif %}
    {% endfor %}
    <script>
		 function closeSuccessModal() {
				const modal = document.getElementById('success-modal');
				if (modal) {
					modal.classList.remove('is-active');
				}
    	}
	</script>
